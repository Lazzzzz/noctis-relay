[project]
name = "noctis-relay"
version = "0.1.0"
description = "Self-hostable relay for Noctis: ephemeral opt-in sessions and optional proximity presence."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
noctis-relay = "noctis_relay.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["noctis_relay"]
